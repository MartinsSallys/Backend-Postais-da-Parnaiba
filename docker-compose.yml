# =============================================================================
# Postais da Parnaiba — Docker Compose
# Usage:
#   make dev       → development (hot-reload)
#   make prod      → production  (optimized)
#   make ssl-init  → obtain a Let's Encrypt certificate
# =============================================================================

services:
  # ===========================================================================
  # DATABASE — shared by dev and prod (started by any profile)
  # ===========================================================================
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postais_da_parnaiba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postais_da_parnaiba}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - postais

  # ===========================================================================
  # DEVELOPMENT — hot-reload, source mounted as volume
  # ===========================================================================
  app:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: postais-dev-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postais_da_parnaiba}
      DEBUG: ${DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./app:/app/app:z
      - ./static:/app/static:z
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - postais

  nginx:
    profiles: ["dev"]
    image: nginx:alpine
    container_name: postais-dev-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ../Postais-da-Parnaiba:/usr/share/nginx/html:z
      - ./static:/app/static:z
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - postais

  # ===========================================================================
  # PRODUCTION — code baked into images, no source mounts
  # ===========================================================================
  prod-app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: postais-prod-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postais_da_parnaiba}
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./static:/app/static:z
    restart: unless-stopped
    networks:
      - postais

  prod-nginx:
    profiles: ["prod"]
    image: nginx:alpine
    container_name: postais-prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.runtime.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ../Postais-da-Parnaiba:/usr/share/nginx/html:ro,z
      - ./static:/app/static:ro,z
      - ./certbot/conf:/etc/letsencrypt:ro,z
      - ./certbot/www:/var/www/certbot:ro,z
    depends_on:
      - prod-app
    restart: unless-stopped
    networks:
      - postais

  # --- SSL auto-renewal (run on demand / via cron)
  certbot:
    profiles: ["cert"]
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:

networks:
  postais:
    driver: bridge
