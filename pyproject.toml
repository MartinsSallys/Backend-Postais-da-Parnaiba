[project]
name = "backend-postais-da-parnaiba"
version = "0.1.0"
description = "Backend FastAPI para o museu digital Postais da Parnaiba"
authors = [{ name = "Postais da Parnaiba" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.115.6,<0.116.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt (==4.0.1)",
    "python-multipart>=0.0.12,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "taskipy>=1.14.0,<2.0.0",
    "cloudinary (>=1.47.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.8.0"
httpx = ">=0.27.0,<0.28.0"
alembic = "^1.20.1"

[tool.taskipy.tasks]
dev = "fastapi dev app/main.py"
db-up = "python scripts/db.py up"
db-down = "python scripts/db.py down"
lint = "ruff check ."
format = "ruff format ."
test = "pytest -q"
migrate = "alembic upgrade head"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migration files don't need to satisfy formatting rules.
"alembic/versions/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
