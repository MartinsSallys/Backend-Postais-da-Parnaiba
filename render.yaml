# =============================================================================
# Postais da Parnaiba — Render Blueprint (Infrastructure as Code)
#
# Docs: https://render.com/docs/blueprint-spec
#
# Secret values (DATABASE_URL, SECRET_KEY, ADMIN_PASSWORD, CLOUDINARY_*) are
# NOT stored here — set them in the Render dashboard after the service is
# created (sync: false marks them as "fill in manually").
# =============================================================================

services:
  - type: web
    name: postais-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: Postais da Parnaiba API
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: postais-da-parnaiba
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
